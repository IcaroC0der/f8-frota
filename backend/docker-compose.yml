services:
  db:
    image: postgres:16-alpine
    container_name: frota_f8_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: frota
      POSTGRES_PASSWORD: frota
      POSTGRES_DB: frota_f8
    ports:
      - "5432:5432"
    volumes:
      - frota_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frota -d frota_f8"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frota_pgdata:
